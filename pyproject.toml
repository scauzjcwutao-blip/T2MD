[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2md"
version = "0.1.0"
description = "Text-to-Markdown Converter & Data Classifier"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=0.6.21",
    "lxml>=4.9.0",
    "chardet>=5.2.0",
    "striprtf>=0.0.26",
    "langdetect>=1.0.9",
    "watchdog>=3.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
t2md = "t2md:main"
t2md-gui = "t2md_gui:main"

# ── 告诉 setuptools 如何找到代码 ──

[tool.setuptools]
py-modules = ["t2md", "t2md_gui"]   # ← 根目录的独立脚本

[tool.setuptools.packages.find]
include = ["engine*"]                # ← engine 包及子包
